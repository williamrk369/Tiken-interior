  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0c0f; }

  #talkwrap { position: absolute; inset: 0; will-change: transform; transform-origin: 50% 37%; }
  #talk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 37%; }
  #shade { position: absolute; inset: 0; pointer-events: none;

  /* B-roll */
  .br { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; opacity: 0; will-change: transform; }
  .br.full { border-radius: 0; box-shadow: 0 40px 120px #000a; }
  .br.full img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 40%; }
  .br.split { height: var(--seam); box-shadow: 0 30px 80px #0008; background: #e9eef6; }

  .br.split .fg { position: absolute; }
  .seam { position: absolute; left: 0; width: 1080px; height: 8px; background: var(--good); box-shadow: 0 0 28px var(--good); transform-origin: 0 50%; opacity: 0; }

  .chapter .no { font-weight: 800; font-size: 26px; letter-spacing: .3em; color: #8fb2ff; }
  .chapter .rule { height: 6px; width: 110px; border-radius: 9px; background: var(--accent); margin: 14px 0 16px; transform-origin: 0 50%; }
  .chapter .tt { font-weight: 850; font-size: 62px; line-height: 1.08; letter-spacing: -.01em; white-space: nowrap; }

  .stat { left: 64px; display: flex; align-items: center; gap: 22px; background: #ffffffee; color: var(--ink); border-radius: 999px;
    padding: 18px 40px 18px 22px; box-shadow: 0 18px 50px #0006; }
  .stat .dot { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 34px; }
  .stat .num { font-weight: 900; font-size: 64px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-weight: 600; font-size: 34px; color: #3b4150; }

  .chip { left: 64px; top: 250px; background: #ffffffee; color: var(--ink); border-radius: 30px; padding: 22px 34px; box-shadow: 0 18px 50px #0006; }
  .chip .k { font-weight: 700; font-size: 28px; letter-spacing: .12em; color: #5b6272; text-transform: uppercase; }
  .chip .v { display: flex; align-items: center; gap: 18px; margin-top: 8px; font-weight: 900; font-size: 58px; }
  .tick { width: 56px; height: 56px; border-radius: 50%; background: var(--good); display: grid; place-items: center; }
  .tick svg { width: 34px; height: 34px; }

  .comment { left: 70px; right: 70px; top: 250px; display: flex; align-items: center; gap: 24px; background: #fff; color: var(--ink);
    border-radius: 999px; padding: 18px 20px 18px 18px; box-shadow: 0 20px 60px #0007; }
  .comment .av { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 40px; flex: none; }
  .comment .tx { flex: 1; font-size: 44px; font-weight: 600; color: #4a5060; white-space: nowrap; }
  .comment .tx b { color: var(--accent); font-weight: 900; }
  .comment .send { width: 84px; height: 84px; border-radius: 50%; background: var(--good); display: grid; place-items: center; flex: none; }

  /* captions: Inter, word by word; the key word sits on the blue block of the B-roll headlines */

  .cap { position: absolute; left: 60px; right: 60px; text-align: center; opacity: 0; }

  .cap .w.key .t { position: relative; }

    tight = c.newClip ? false : !tight;
    if (c.newClip && i > 0) {
      tl.fromTo('#talk', { scale: 1.14 }, { scale: 1, duration: 0.5, immediateRender: false }, c.t);
      OM.sfx('whoosh', c.t, { gain: 0.5 });
    } else set('#talk', c.t, { scale: tight ? TIGHT : 1 });
  });
  tl.addLabel('scene:hook', 0);

  // ---- B-roll: full-screen photos are thrown in as cards; split screens drop in over the talk ---
  const brollRoot = $('#broll');
  const IW = 941, IH = 1672;                     // all ten photos are 941 × 1672
  D.broll.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = `br ${b.kind}`;
    el.dataset.omId = `broll-${b.src.split('/').pop().replace('.webp', '')}`;
    const prev = D.broll[i - 1], next = D.broll[i + 1];
    const fromSplit = prev && prev.kind === 'split' && Math.abs(prev.end - b.start) < 0.05;
    const toSplit = next && next.kind === 'split' && Math.abs(next.start - b.end) < 0.05;
    tl.addLabel(`scene:${el.dataset.omId}`, b.start);
    if (b.kind === 'full') {
      el.innerHTML = `<img src="${b.src}">`;
      brollRoot.appendChild(el);
      const img = $('img', el), dur = b.end - b.start;

        tl.fromTo('#talkwrap', { y: 0, scale: 1 }, { y: SEAM - 380, scale: 0.8, duration: 0.6, ease: 'expo.inOut', immediateRender: false }, b.start - 0.05)

  const tData = cue('data') ?? 14.68;

  // ---- captions: word by word, key word on the blue block ------------------------------------
  const capsRoot = $('#caps');

    const y = inBroll(c.start, c.end, 'split') ? SEAM : inBroll(c.start, c.end, 'full') ? Number(V.capYFull) : Number(V.capY);
    el.style.top = y + 'px';

    el.style.fontSize = V.capSize + 'px';
    // *key* markup → words
    let key = false;
    const toks = c.text.split(/\s+/).map((raw) => {
      let w = raw, k = key;

  tl.fromTo('#endcard', { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, END)
