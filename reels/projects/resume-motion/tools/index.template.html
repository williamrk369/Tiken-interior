<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0c0f; }
  #film { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #0b0c0f; font-family: Inter, sans-serif; color: #fff; }

  #talk { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 37%; }

  .rrow .ic { width: 78px; height: 78px; } .rrow .tk { margin-left: auto; width: 64px; height: 64px; }
  .gdoc .ct { font-weight: 850; font-size: 40px; }
  .gdoc svg { display: block; width: 100%; height: 190px; margin-top: 14px; overflow: visible; }
  .ch1 { opacity: 0; }

  /* packaging cards */
  .card { position: absolute; opacity: 0; visibility: hidden; will-change: transform; }
  .chapter { left: 64px; top: 236px; background: color-mix(in srgb, var(--ink) 92%, transparent); border-radius: 26px; padding: 24px 40px 28px;
    outline: 2px solid #ffffff22; outline-offset: -2px; box-shadow: 0 24px 60px #0007; }
  .chapter .no { font-weight: 800; font-size: 26px; letter-spacing: .3em; color: #8fb2ff; }

    padding: 18px 40px 18px 22px; box-shadow: 0 18px 50px #0006; }

  .stat .num { font-weight: 900; font-size: 64px; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .stat .lbl { font-weight: 600; font-size: 34px; color: #3b4150; }

  .chip { left: 64px; top: 250px; background: #ffffffee; color: var(--ink); border-radius: 30px; padding: 22px 34px; box-shadow: 0 18px 50px #0006; }
  .chip .k { font-weight: 700; font-size: 28px; letter-spacing: .12em; color: #5b6272; text-transform: uppercase; }
  .chip .v { display: flex; align-items: center; gap: 18px; margin-top: 8px; font-weight: 900; font-size: 58px; }

  .tick svg { width: 34px; height: 34px; }

    border-radius: 999px; padding: 18px 20px 18px 18px; box-shadow: 0 20px 60px #0007; }
  .comment .av { width: 84px; height: 84px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 40px; flex: none; }
  .comment .tx { flex: 1; font-size: 44px; font-weight: 600; color: #4a5060; white-space: nowrap; }
  .comment .tx b { color: var(--accent); font-weight: 900; }
  .comment .send { width: 84px; height: 84px; border-radius: 50%; background: var(--good); display: grid; place-items: center; flex: none; }

  /* captions: Inter, word by word; the key word sits on the blue block of the B-roll headlines */
  #caps { position: absolute; inset: 0; pointer-events: none; }
  .cap { position: absolute; left: 60px; right: 60px; text-align: center; opacity: 0; }
  .cap .w { opacity: 0; display: inline-block; font-weight: 800; letter-spacing: -.01em; line-height: 1.18; margin: 0 .12em;
    -webkit-text-stroke: .16em #000000d9; paint-order: stroke fill; text-shadow: 0 .06em .3em #0009; }
  .cap .w.key { white-space: nowrap; position: relative; color: #fff; -webkit-text-stroke: 0; text-shadow: none; padding: 0 .16em; margin: 0 .06em; }
  .cap .w.key .blk { position: absolute; inset: .08em 0 .02em; background: var(--accent); border-radius: .16em; transform-origin: 0 50%;
    box-shadow: 0 .1em .4em #0006; }
  .cap .w.key .t { position: relative; }

  #endcard { position: absolute; inset: 0; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 34px;
    background: radial-gradient(120% 80% at 50% 40%, #12151cf2, #07080af7); }
  #endcard .big { font-weight: 900; font-size: 120px; letter-spacing: -.03em; line-height: 1; }
  #endcard .kw { position: relative; display: inline-block; padding: 6px 30px 14px; margin-top: 10px; }

  #endcard .line { font-weight: 600; font-size: 46px; color: #c9d2e3; }
</style>

<body>
<div id="film" data-composition-id="film" data-width="1080" data-height="1920">
  <audio id="om-voice" src="assets/voice.wav" data-start="0" data-duration="55.147" data-track-index="9" data-volume="1"></audio>
  <div id="talkwrap" data-om-id="talk-frame">
    <video id="talk" class="clip" data-om-id="talk" data-var-src="talk" src="assets/talk.mp4" data-start="0" data-track-index="0" muted playsinline></video>
    <div id="shade"></div>
  </div>
  <div id="panels"></div>
  <div class="seam" data-om-id="seam"></div>

  <div class="card stat" id="stat1" data-om-id="stat-applications" style="top:250px">
    <div class="dot" style="background:var(--accent)">✉</div><div class="num"><span class="v">0</span>+</div><div class="lbl">applications</div>
  </div>
  <div class="card stat" id="stat2" data-om-id="stat-callbacks" style="top:380px">
    <div class="dot" style="background:var(--bad)">✆</div><div class="num" style="color:var(--bad)">0</div><div class="lbl">callbacks</div>
  </div>
  <div class="card chapter" id="ch1" data-om-id="fix-1"><div class="no">FIX 01</div><div class="rule"></div><div class="tt" data-var-text="fix1">Use the right words</div></div>
  <div class="card chapter" id="ch2" data-om-id="fix-2"><div class="no">FIX 02</div><div class="rule"></div><div class="tt" data-var-text="fix2">Add numbers</div></div>
  <div class="card chapter" id="ch3" data-om-id="fix-3"><div class="no">FIX 03</div><div class="rule"></div><div class="tt" data-var-text="fix3">Skip the fancy template</div></div>
  <div class="card chapter" id="ch4" data-om-id="fix-all"><div class="no">RECAP</div><div class="rule"></div><div class="tt" data-var-text="fixAll">Fix these 3 → more calls</div></div>
  <div class="card comment" id="comment" data-om-id="comment-bar">
    <div class="av">R</div><div class="tx">Comment <b data-om-var="keyword">“RESUME”</b></div>
    <div class="send"><svg viewBox="0 0 24 24" width="40" height="40"><path d="M4 12l16-8-6 16-2.5-6.5z" fill="#fff"/></svg></div>
  </div>

  <div id="caps" data-om-id="captions"></div>

  <div id="endcard" data-om-id="end-card">
    <div class="big">Comment</div>
    <div class="kw"><div class="blk"></div><div class="t" data-var-text="keyword">RESUME</div></div>
    <div class="line" data-var-text="endLine">Follow for more resume tips</div>
  </div>
</div>

<script type="application/json" id="reel-data">__DATA__</script>
<script type="application/json" id="om-cues">__CUES__</script>
<script>
  // declared defaults first, so the film also builds outside the om engine
  const DECL = JSON.parse(document.documentElement.getAttribute('data-composition-variables'));
  const V = Object.assign(Object.fromEntries(DECL.map((d) => [d.id, d.default])), OM.vars());
  const D = JSON.parse(document.getElementById('reel-data').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const film = $('#film');
  const TALK_END = 55.147;
  const SEAM = Number(V.splitY), TIGHT = Number(V.tight);
  film.style.setProperty('--seam', SEAM + 'px');
  $('.seam').style.top = (SEAM - 4) + 'px';
  $('#comment b').textContent = `“${V.keyword}”`;

  const tl = gsap.timeline({ paused: true, defaults: { ease: 'expo.out' } });
  const set = (el, at, v) => tl.set(el, v, at);

  // ---- music: lo-fi explainer direction, ducked under the voice ------------------------------
  OM.music({ product: 'explainer', variant: 2 });

  // ---- the talk: every jump cut becomes a wide ↔ tight punch-in; each new clip pushes in -------
  let tight = false;
  D.cuts.forEach((c, i) => {
    tight = c.newClip ? false : !tight;
    if (c.newClip && i > 0) {
      tl.fromTo('#talk', { scale: 1.14 }, { scale: 1, duration: 0.5, immediateRender: false }, c.t);
      OM.sfx('whoosh', c.t, { gain: 0.5 });
    } else set('#talk', c.t, { scale: tight ? TIGHT : 1 });
  });
  tl.addLabel('scene:hook', 0);

  // ---- packaging, each landing on its word ----------------------------------------------------
  const cue = (w, n) => { try { return OM.cue(w, n); } catch { return null; } };
  function cardIn(el, at, out, sound = 'pop') {
    tl.fromTo(el, { autoAlpha: 0, y: 30, scale: 0.92 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.55, ease: 'back.out(1.6)', immediateRender: false }, at)
      .fromTo(el, { autoAlpha: 1, y: 0, scale: 1 }, { autoAlpha: 0, y: -16, duration: 0.28, ease: 'power2.in', immediateRender: false }, out - 0.28);
    if (sound) OM.sfx(sound, at + 0.08, { gain: 0.6 });
  }
  // the hook: applications pile up, callbacks stay at zero
  const tThousands = cue('thousands') ?? 1.24, tCalling = cue('calling') ?? 3.45;
  cardIn('#stat1', tThousands - 0.35, 4.38);
  const c1 = { v: 0 };
  tl.fromTo(c1, { v: 0 }, { v: 1000, immediateRender: false, duration: 0.9, ease: 'power3.out', onUpdate: () => { $('#stat1 .v').textContent = Math.round(c1.v).toLocaleString('en-US'); } }, tThousands - 0.3);
  OM.sfx('count', tThousands - 0.25, { dur: 0.8, gain: 0.4 });
  cardIn('#stat2', tCalling - 0.25, 4.38, 'thud');

  // the fixes: a chapter card where each one starts
  const chapters = [['#ch1', 7.36, 9.0], ['#ch2', 21.84, 23.3], ['#ch3', 33.8, 35.12], ['#ch4', 46.1, 47.78]];
  chapters.forEach(([sel, a, b], k) => {
    tl.addLabel(`scene:fix-${k + 1}`, a);
    tl.fromTo(sel, { autoAlpha: 0, x: -40 }, { autoAlpha: 1, x: 0, duration: 0.5, immediateRender: false }, a)
      .fromTo(`${sel} .rule`, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: 'expo.inOut', immediateRender: false }, a + 0.1)
      .fromTo(sel, { autoAlpha: 1, x: 0 }, { autoAlpha: 0, x: -24, duration: 0.25, ease: 'power2.in', immediateRender: false }, b - 0.25);
    OM.sfx('impact', a + 0.05, { gain: k === 3 ? 0.5 : 0.35 });
  });

  // ---- motion graphics, built in code: each one shows what is being said, moving on the words --
  const panelsRoot = $('#panels');
  const SVG = {
    check: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',

      const at = units[j].at;
      if (sp.classList.contains('key')) {
        tl.fromTo(sp, { opacity: 0, scale: 1.35, rotation: -3 }, { opacity: 1, scale: 1, rotation: -1.5, duration: 0.42, ease: 'back.out(2.2)', immediateRender: false }, at)
          .fromTo($('.blk', sp), { scaleX: 0 }, { scaleX: 1, duration: 0.32, immediateRender: false }, at + 0.02);
      } else {
        tl.fromTo(sp, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.24, ease: 'power3.out', immediateRender: false }, at);
      }
    });
    if (el.querySelector('.key')) OM.sfx('tick', c.times[toks.findIndex((t) => t.k)] ?? c.start, { gain: 0.25 });
  });

  // ---- end card ----------------------------------------------------------------------------
  const END = TALK_END;
  tl.addLabel('scene:end', END);
  tl.fromTo('#endcard', { opacity: 0 }, { opacity: 1, duration: 0.45, ease: 'power2.out', immediateRender: false }, END)
    .fromTo('#endcard .big', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, immediateRender: false }, END + 0.1)
    .fromTo('#endcard .kw', { opacity: 0, scale: 1.4, rotation: -4 }, { opacity: 1, scale: 1, rotation: -2, duration: 0.6, ease: 'back.out(2)', immediateRender: false }, END + 0.4)
    .fromTo('#endcard .kw .blk', { scaleX: 0 }, { scaleX: 1, duration: 0.4, immediateRender: false }, END + 0.42)
    .fromTo('#endcard .line', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, immediateRender: false }, END + 0.9);
  // the end card holds as a poster: a slow push, the keyword block breathing
  const HOLD = Number(V.endHold) || 3.4;
  tl.fromTo('#endcard .big, #endcard .line', { scale: 1 }, { scale: 1.06, duration: HOLD - 0.4, ease: 'none', immediateRender: false }, END + 0.4)
    .fromTo('#endcard .kw .t', { scale: 1 }, { scale: 1.08, duration: HOLD - 1, ease: 'sine.inOut', immediateRender: false }, END + 1)
    .fromTo('#endcard .kw .blk', { scaleY: 1 }, { scaleY: 1.12, duration: (HOLD - 1) / 2, ease: 'sine.inOut', yoyo: true, repeat: 1, immediateRender: false }, END + 1);
  OM.sfx('riser', END, { dur: 0.4, gain: 0.4 });
  OM.sfx('impact', END + 0.42, { gain: 0.6 });
  OM.sfx('chime', END + 0.95, { gain: 0.5 });
  tl.to({}, { duration: Number(V.endHold) || 3.4 }, END);

  (window.__timelines = window.__timelines || {})['film'] = tl;
</script>
